name: Deploy latest release Web build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v6
        with:
          ref: vita
          fetch-depth: 0

      - name: Select release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_tag="$(git describe --tags --match 'v*' --abbrev=0 origin/vita)"

          if [[ -z "$release_tag" ]]; then
            echo "No release tag was found." >&2
            exit 1
          fi

          git rev-parse --verify "refs/tags/${release_tag}^{commit}" >/dev/null
          git checkout --detach "refs/tags/${release_tag}"

          if [[ ! -f web/shell.html ]]; then
            echo "Release tag $release_tag predates the Web build support." >&2
            exit 1
          fi

          release_commit="$(git rev-parse HEAD)"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "Building Web release $release_tag ($release_commit)"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Emscripten 6.0.9
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.9
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.9

      - name: Build WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-web

          mkdir -p site
          cp build-web/ctr-native.html site/index.html
          cp build-web/ctr-native.js site/ctr-native.js
          cp build-web/ctr-native.wasm site/ctr-native.wasm
          cp build-web/ctr-native.data site/ctr-native.data

      - name: Record deployed release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          printf '%s\n' "$RELEASE_TAG" > site/release-tag.txt
          {
            echo "### GitHub Pages Web build"
            echo ""
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
